name: bdd

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *" # nightly regression run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cucumber (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Start ShipDesk and Selenium Grid
        run: docker compose up -d --wait
      - name: Run scenarios on ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
          GRID_URL: http://localhost:4444
          APP_URL: http://shipdesk:3000 # browsers live inside the compose network
          API_URL: http://localhost:3000
        run: mvn -B -ntp test
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 7
      - name: Upload Cucumber HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: target/cucumber-report.html
          retention-days: 7
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 100 shipdesk selenium-hub

  report:
    name: allure report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true
      - name: Generate one report for both browsers
        run: mvn -B -ntp allure:report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14
      - name: Prepare GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy-report:
    name: publish report to GitHub Pages
    needs: report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
